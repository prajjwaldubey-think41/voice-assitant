[project]
name = "voice-assistant"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
	"deepgram-sdk>=7.7.1,<8.0.0",
	"google-genai>=1.0.0,<2.0.0",
	"fastapi[standard]>=0.141.1",
]

[dependency-groups]
dev = [
	"pytest>=8.0.0",
	"pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
